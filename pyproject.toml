[project]
name = "multicam-tracker"
version = "0.1.0"
description = "Educational multi-camera 3D people tracking — DeepStream MV3DT concepts on a laptop, no NVIDIA GPU required"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexander Gonzalez" }]
keywords = ["multi-camera", "tracking", "computer-vision", "bird-eye-view", "rerun", "yolo"]
dependencies = [
    "ultralytics==8.4.96",
    "rerun-sdk==0.34.1",
    "huggingface-hub>=0.34",
    "opencv-python>=4.10",
    "scipy>=1.13",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/alexandergg/multicam-3d-tracking"

[project.scripts]
download-data = "multicam_tracker.download:main"
demo = "multicam_tracker.demo:main"
evaluate = "multicam_tracker.evaluate:main"
check-calibration = "multicam_tracker.check_calibration:main"
render-preview = "multicam_tracker.render_preview:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multicam_tracker"]
